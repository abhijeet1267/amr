<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#51606e"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="40" y="50" fill="#182026" font-size="24" font-weight="700">Serial Protocol</text>
  <text x="40" y="74" fill="#51606e" font-size="14">Newline-delimited text, 9600 baud. Command on the left, matching response on the right.</text>

  <rect x="40" y="92" width="470" height="42" rx="9" fill="#e4ecf7" stroke="#1a5fb4"/>
  <text x="58" y="119" fill="#1a5fb4" font-size="16" font-weight="700">Pi &#8594; Arduino (commands)</text>
  <rect x="610" y="92" width="470" height="42" rx="9" fill="#e4f1e9" stroke="#1e7f4f"/>
  <text x="628" y="119" fill="#1e7f4f" font-size="16" font-weight="700">Arduino &#8594; Pi (responses)</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="40" y="146" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="60" y="177" fill="#182026">PING</text>
    <line x1="510" y1="172" x2="600" y2="172" stroke="#51606e" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="146" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="630" y="177" fill="#1e7f4f">PONG</text>

    <rect x="40" y="210" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="60" y="241" fill="#182026">MOVE L=&lt;-255..255&gt; R=&lt;-255..255&gt;</text>
    <line x1="510" y1="236" x2="600" y2="236" stroke="#51606e" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="210" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="630" y="232" fill="#1e7f4f">ACK MOVE L= R=</text>
    <text x="630" y="250" fill="#9a6700">ERR &lt;code&gt; [msg]</text>

    <rect x="40" y="274" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="60" y="305" fill="#182026">STOP</text>
    <line x1="510" y1="300" x2="600" y2="300" stroke="#51606e" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="274" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="630" y="305" fill="#51606e">(no reply &#8212; by design)</text>

    <rect x="40" y="338" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="60" y="369" fill="#182026">STATUS</text>
    <line x1="510" y1="364" x2="600" y2="364" stroke="#51606e" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="338" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="630" y="369" fill="#1e7f4f">STATUS L= R= MODE=</text>

    <rect x="40" y="402" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="60" y="433" fill="#182026">SENSOR</text>
    <line x1="510" y1="428" x2="600" y2="428" stroke="#51606e" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="402" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="630" y="433" fill="#1e7f4f">SENSOR F= L= R= B=</text>

    <rect x="40" y="466" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="60" y="497" fill="#182026">VERSION</text>
    <line x1="510" y1="492" x2="600" y2="492" stroke="#51606e" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="610" y="466" width="470" height="52" rx="8" fill="#ffffff" stroke="#d8dee5"/>
    <text x="630" y="488" fill="#1e7f4f">VERSION &lt;ver&gt;</text>
    <text x="630" y="506" fill="#9a6700">WATCHDOG TRIGGERED</text>
  </g>

  <line x1="40" y1="538" x2="1080" y2="538" stroke="#d8dee5"/>
  <text x="40" y="566" fill="#51606e" font-size="13">Legacy one-letter drive: F / B / L / R / S &#8212; kept for the original web panel.</text>
  <text x="40" y="588" fill="#51606e" font-size="13">The Arduino watchdog and ultrasonic Layer-1 can force a STOP at any time, from either direction.</text>
</svg>
