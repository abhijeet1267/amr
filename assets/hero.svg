<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)" stroke="#d8dee5" stroke-width="1.5"/>

  <!-- top-down robot schematic, body front = up -->
  <g>
    <path d="M196,86 L210,40 L224,86 Z" fill="none" stroke="#1a5fb4" stroke-width="1.5" opacity="0.7"/>
    <path d="M132,166 L86,180 L132,194 Z" fill="none" stroke="#1a5fb4" stroke-width="1.5" opacity="0.7"/>
    <path d="M288,166 L334,180 L288,194 Z" fill="none" stroke="#1a5fb4" stroke-width="1.5" opacity="0.7"/>
    <path d="M196,274 L210,318 L224,274 Z" fill="none" stroke="#1a5fb4" stroke-width="1.5" opacity="0.7"/>
    <rect x="130" y="104" width="20" height="152" rx="9" fill="#d8dee5" stroke="#c3ccd6"/>
    <rect x="290" y="104" width="20" height="152" rx="9" fill="#d8dee5" stroke="#c3ccd6"/>
    <rect x="152" y="92" width="116" height="176" rx="16" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
    <rect x="192" y="96" width="36" height="18" rx="4" fill="#e4f1e9" stroke="#1e7f4f" stroke-width="1.5"/>
    <circle cx="210" cy="86" r="6" fill="#1a5fb4"/>
    <circle cx="210" cy="274" r="6" fill="#1a5fb4"/>
    <circle cx="150" cy="180" r="6" fill="#1a5fb4"/>
    <circle cx="270" cy="180" r="6" fill="#1a5fb4"/>
    <circle cx="210" cy="286" r="9" fill="#d8dee5" stroke="#c3ccd6"/>
    <g fill="#51606e" font-size="12">
      <text x="210" y="30" text-anchor="middle">front</text>
      <text x="210" y="345" text-anchor="middle">rear</text>
      <text x="58" y="184">left</text>
      <text x="338" y="184">right</text>
    </g>
  </g>

  <text x="470" y="150" fill="#182026" font-size="76" font-weight="800" letter-spacing="1">AMR</text>
  <text x="472" y="192" fill="#1a5fb4" font-size="22" font-weight="600">Autonomous Mobile Robot</text>
  <text x="472" y="222" fill="#51606e" font-size="17">A safe, layered control stack for a differential-drive smart-warehouse robot.</text>

  <g font-size="14">
    <rect x="472" y="248" width="150" height="32" rx="16" fill="#ffffff" stroke="#d8dee5"/>
    <text x="547" y="269" fill="#182026" text-anchor="middle">Raspberry Pi</text>
    <rect x="634" y="248" width="150" height="32" rx="16" fill="#ffffff" stroke="#d8dee5"/>
    <text x="709" y="269" fill="#182026" text-anchor="middle">Arduino UNO</text>
    <rect x="796" y="248" width="172" height="32" rx="16" fill="#e4f1e9" stroke="#1e7f4f"/>
    <text x="882" y="269" fill="#1e7f4f" text-anchor="middle">Two-layer safety</text>
    <rect x="980" y="248" width="176" height="32" rx="16" fill="#e4ecf7" stroke="#1a5fb4"/>
    <text x="1068" y="269" fill="#1a5fb4" text-anchor="middle">Web + Warehouse</text>
  </g>
</svg>
