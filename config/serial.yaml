# Serial link: Raspberry Pi 5 <-> Arduino UNO (USB CDC, /dev/ttyACM0 today).
#
# NOTE: the device node can change between boots / machines (e.g. /dev/ttyUSB0).
# Prefer discovery (see tools/health_check.sh and docs/setup_raspberry_pi.md)
# over relying on this literal path. `port` is the fallback.
serial:
  port: "/dev/ttyACM0"
  baudrate: 9600
  # Per-command response timeout (seconds). Tune if the link is slow.
  timeout: 1.0
  read_timeout_s: 1.0
  write_timeout_s: 0.5
  # Must match firmware/arduino/amr_controller (PROTOCOL_VERSION).
  protocol_version: "1.1"

  # Opening the port toggles DTR, which resets the UNO; it needs ~2 s to reboot
  # before the sketch answers. If the first PING is missed (slow boot), start()
  # retries — up to this many attempts, this far apart. Without it, an
  # immediately-following PING always times out against real hardware.
  startup_ping_attempts: 5
  startup_ping_interval_s: 1.0
