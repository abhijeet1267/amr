<!doctype html>
<html>
  <head>
    <!--
    Served path. Flutter replaces $FLUTTER_BASE_HREF at build time. It must
    start and end with "/", and the folder must be served as the web root.
    -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="AMR Controller — operator client for the AMR robot."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AMR Controller" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>AMR Controller</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      /* Boot screen. Shown until Flutter paints its first frame, so a slow
         first load is visible progress instead of a blank page. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f3f5f7;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #182026;
        text-align: center;
        padding: 24px;
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border: 3px solid #d8dee5;
        border-top-color: #1a5fb4;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 700;
      }
      #boot .status {
        font-size: 13px;
        color: #51606e;
        max-width: 460px;
        line-height: 1.5;
      }
      #boot .hint {
        font-size: 12px;
        color: #8592a0;
        max-width: 460px;
        line-height: 1.5;
      }
      #boot .err {
        display: none;
        margin-top: 6px;
        padding: 12px 14px;
        text-align: left;
        background: #fdecea;
        border: 1px solid #c0392b;
        border-radius: 8px;
        color: #7b241c;
        font-size: 12.5px;
        max-width: 540px;
        line-height: 1.55;
      }
      #boot .err b {
        display: block;
        margin-bottom: 4px;
        color: #c0392b;
      }
      #boot .err code {
        background: #f7d9d5;
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 12px;
      }
      #boot.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ring"></div>
      <h1>AMR Controller</h1>
      <div class="status" id="boot-status">Starting…</div>
      <div class="hint">
        First load can take a few seconds — the app engine is being downloaded.
      </div>
      <div class="err" id="boot-err"></div>
    </div>

    <script>
      // Boot diagnostics. Turns the silent blank-page failure into a visible,
      // actionable message: a slow load shows progress, and a missing file says
      // which file and the usual cause.
      (function () {
        var boot = document.getElementById("boot");
        var status = document.getElementById("boot-status");
        var err = document.getElementById("boot-err");
        var done = false;

        function hide() {
          if (done) return;
          done = true;
          boot.classList.add("hidden");
        }

        function fail(title, detail) {
          if (done) return;
          status.textContent = "Could not start.";
          err.style.display = "block";
          err.innerHTML = "<b>" + title + "</b>" + detail;
          var ring = document.querySelector("#boot .ring");
          if (ring) ring.style.animation = "none";
        }

        // Flutter signals its first painted frame with this event.
        window.addEventListener("flutter-first-frame", hide, { once: true });

        // Fallback: if the event is missed, watch for the Flutter view element.
        var poll = setInterval(function () {
          if (document.querySelector("flutter-view, flt-glass-pane")) {
            hide();
            clearInterval(poll);
          }
        }, 400);

        setTimeout(function () {
          if (!done)
            status.textContent =
              "Still loading… this is taking longer than usual.";
        }, 12000);

        setTimeout(function () {
          if (!done) {
            fail(
              "Taking too long",
              "The app engine has not started after 45 seconds. Check that this folder is " +
                "served over HTTP from its own root (not opened as a file), then reload.",
            );
          }
        }, 45000);

        window.addEventListener(
          "error",
          function (e) {
            var src = (e && e.target && e.target.src) || "";
            if (src && /main\.dart\.js|canvaskit/.test(src)) {
              fail(
                "A required file failed to load",
                "Could not load <code>" +
                  src.split("/").pop() +
                  "</code>. This folder must be " +
                  "served over HTTP from its own root, and the server must send " +
                  "<code>application/wasm</code> for <code>.wasm</code> files. " +
                  "Run <code>serve.py</code> (included) and reload.",
              );
            }
          },
          true,
        );
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
